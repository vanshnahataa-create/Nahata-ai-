name: Keep Nahata AI Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Nahata AI
        run: |
          curl -L --max-time 60 -sS \
            -o /dev/null \
            -w "Nahata AI response: %{http_code}\n" \
            "https://nahata-ai.onrender.com/"
