<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nahata.AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1033;--ink2:#1B1C54;--violet:#6C5BFF;--lav:#C9C4FF;--saffron:#FFB547;--text:#F2F1FF;--mute:#9C9AD0;--line:rgba(201,196,255,.16)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Bricolage Grotesque',system-ui,sans-serif}
html,body{height:100%}
body{background:radial-gradient(900px 500px at 15% -10%,#3A2FA8 0%,transparent 60%),var(--ink);color:var(--text);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:700;letter-spacing:-.02em}
.mark{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 200deg,var(--violet),var(--lav),var(--saffron),var(--violet))}
#userBox{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
#userBox b{color:var(--text);font-weight:600}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
#userBox button{background:none;border:none;color:var(--mute);cursor:pointer;font-size:13px;text-decoration:underline}
#chat{flex:1;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:14px;max-width:820px;width:100%;margin:0 auto}
#empty{margin:auto 0;padding:10px 4px}
#empty h2{font-size:clamp(30px,6vw,46px);line-height:1.05;letter-spacing:-.03em;font-weight:700;max-width:14em}
#empty p{margin-top:14px;color:var(--mute);font-size:16px;max-width:30em;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:14px;font-size:14px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--violet);background:rgba(108,91,255,.18)}
.msg{max-width:88%;padding:13px 17px;border-radius:20px;line-height:1.55;font-size:15px;word-wrap:break-word}
.msg .txt{white-space:pre-wrap}
.user{background:var(--violet);margin-left:auto;border-bottom-right-radius:6px}
.ai{background:rgba(255,255,255,.07);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg img,.msg video{max-width:100%;border-radius:12px;margin-top:10px;display:block}
.msg pre{background:#090A25;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ba figure figcaption{font-size:12px;color:var(--mute);margin-top:6px}
.ba img{margin-top:0;width:100%}
.btn{display:inline-block;margin-top:10px;padding:9px 14px;border-radius:12px;border:none;background:var(--saffron);color:#2A1A00;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--lav);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}

#composer{padding:10px 14px calc(14px + env(safe-area-inset-bottom));max-width:820px;width:100%;margin:0 auto}
#taggedFiles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tagChip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:6px 8px;font-size:12.5px}
.tagChip img,.tagChip video,.tagChip .ext{width:36px;height:36px;object-fit:cover;border-radius:8px;background:var(--ink2);display:grid;place-items:center;font-size:11px;font-weight:700}
.tagChip small{color:var(--mute);display:block}
.tagChip .x{width:20px;height:20px;border-radius:50%;border:none;background:var(--saffron);color:#2A1A00;cursor:pointer;font-size:11px}
#bar{display:flex;align-items:flex-end;gap:6px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:30px;padding:6px}
#bar:focus-within{border-color:var(--violet);box-shadow:0 0 0 4px rgba(108,91,255,.22)}
#msgInput{flex:1;border:none;outline:none;background:transparent;color:var(--text);font-size:16px;padding:11px 6px;resize:none;max-height:140px;line-height:1.4}
#msgInput::placeholder{color:var(--mute)}
.ib{width:44px;height:44px;border:none;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--text);background:transparent}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#micBtn{background:linear-gradient(135deg,var(--violet),#9A6BFF);box-shadow:0 0 0 0 rgba(108,91,255,.6);animation:idle 2.8s infinite}
@keyframes idle{70%{box-shadow:0 0 0 12px rgba(108,91,255,0)}100%{box-shadow:0 0 0 0 rgba(108,91,255,0)}}
#sendBtn{background:var(--saffron);color:#2A1A00}
#sendBtn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

/* MIC OVERLAY - the one memorable thing */
#mic{position:fixed;inset:0;z-index:50;background:rgba(10,11,40,.94);backdrop-filter:blur(18px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
#mic.open{display:flex}
.orbWrap{position:relative;width:200px;height:200px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--violet);opacity:0}
#mic.live .ring{animation:ring 2.4s infinite}
#mic.live .ring:nth-child(2){animation-delay:.8s}#mic.live .ring:nth-child(3){animation-delay:1.6s}
@keyframes ring{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.25);opacity:0}}
#orb{position:relative;width:116px;height:116px;border-radius:50%;border:none;cursor:pointer;color:#fff;display:grid;place-items:center;background:conic-gradient(from 160deg,var(--violet),var(--lav),var(--saffron),var(--violet));box-shadow:0 18px 60px rgba(108,91,255,.55)}
#orb svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mic.live #orb{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
#micState{font-size:20px;font-weight:600}
#liveText{min-height:84px;max-width:560px;font-size:24px;line-height:1.35;font-weight:500;letter-spacing:-.01em}
#liveText:empty::before{content:"Say something like: remove the person on the left";color:var(--mute);font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{padding:11px 20px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);font-size:15px;cursor:pointer}
.pill.main{background:var(--saffron);color:#2A1A00;border-color:var(--saffron);font-weight:600}

/* LOGIN */
#loginModal{position:fixed;inset:0;z-index:60;background:rgba(10,11,40,.92);backdrop-filter:blur(16px);display:flex;justify-content:center;align-items:center}
.loginCard{background:var(--ink2);border:1px solid var(--line);padding:32px 26px;border-radius:26px;width:92%;max-width:380px}
.loginCard h2{font-size:28px;letter-spacing:-.03em}
.loginCard p{color:var(--mute);font-size:14px;margin-top:6px;line-height:1.45}
.loginCard input{width:100%;padding:14px 16px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:14px;margin-top:12px;outline:none;font-size:16px}
.loginCard input:focus{border-color:var(--violet)}
.loginBtn{width:100%;padding:14px;background:var(--saffron);color:#2A1A00;border:none;border-radius:14px;margin-top:16px;font-weight:700;font-size:16px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:70}
.hdr{display:flex;align-items:center;gap:12px}.hdr .pill{padding:7px 14px;font-size:13px}
.msg pre{position:relative;padding-top:34px}
.cp{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer}
.txt>code{font:13px ui-monospace,Menlo,monospace;background:rgba(255,255,255,.1);padding:1px 5px;border-radius:6px}
.msg h4{font-size:16px;margin:8px 0 2px}
.acts{display:flex;gap:6px;margin-top:8px}.acts button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:9px;padding:4px 10px;font-size:12px;cursor:pointer}
.acts button:hover{color:var(--text);border-color:var(--violet)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div id="loginModal">
  <div class="loginCard">
    <h2>Nahata.AI</h2>
    <p>Edit photos, write code, and ask anything. Made by Vansh Rajesh Nahata.</p>
    <input id="nameInput" placeholder="Your name" autocomplete="name">
    <input id="emailInput" type="email" placeholder="yourname@gmail.com" autocomplete="email">
    <button class="loginBtn" onclick="saveUser()">Start chatting</button>
  </div>
</div>

<header>
  <div class="brand"><div class="mark"></div>Nahata.AI</div>
  <div class="hdr"><button class="pill" id="newChat">New chat</button><div id="userBox"></div></div>
</header>

<div id="chat">
  <div id="empty">
    <h2>Edit a photo, write code, or just ask.</h2>
    <p>Attach a picture and say what to change: remove someone, add someone, or switch the whole scene.</p>
    <div class="chips">
      <button class="chip" data-p="Remove the person in the background">Remove the person in the background</button>
      <button class="chip" data-p="Add a person standing next to me">Add a person next to me</button>
      <button class="chip" data-p="Change this photo to a night scene with city lights">Change it to a night scene</button>
      <button class="chip" data-p="Write Arduino code to blink an LED">Write Arduino code for an LED</button>
    </div>
  </div>
</div>

<div id="composer">
  <div id="taggedFiles"></div>
  <div id="bar">
    <input type="file" id="fileInput" hidden multiple accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.zip">
    <button class="ib" id="fileBtn" aria-label="Attach photo or file" title="Attach photo or file"><svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.6-8.6a3.7 3.7 0 015.2 5.2l-8.6 8.6a1.8 1.8 0 01-2.6-2.6l7.9-7.9"/></svg></button>
    <textarea id="msgInput" rows="1" placeholder="Message Nahata.AI"></textarea>
    <button class="ib" id="micBtn" aria-label="Speak your message" title="Speak"><svg viewBox="0 0 24 24" style="stroke:#fff"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
    <button class="ib" id="sendBtn" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
</div>

<div id="mic" role="dialog" aria-label="Voice input">
  <div class="orbWrap"><div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <button id="orb" aria-label="Start or stop listening"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button></div>
  <div id="micState">Listening</div>
  <div id="liveText"></div>
  <div class="row">
    <button class="pill" id="langBtn">English</button>
    <button class="pill" id="micCancel">Cancel</button>
    <button class="pill" id="micDone">Use this text</button>
    <button class="pill main" id="micSend">Send now</button>
  </div>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let user=JSON.parse(localStorage.getItem("nahata_user")||"null");
let pendingFiles=[], busy=false, ctl=null, chatLog=JSON.parse(localStorage.getItem("nahata_hist")||"[]");

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3200);}

function checkLogin(){
  if(user&&user.email){
    $("loginModal").style.display="none";
    $("userBox").innerHTML=`<div class="avatar">${esc(user.name[0]||"U").toUpperCase()}</div><b>${esc(user.name)}</b><button onclick="logout()">Log out</button>`;
  }
}
function saveUser(){
  const name=$("nameInput").value.trim(), email=$("emailInput").value.trim();
  if(!name||!email){toast("Enter your name and Gmail");return;}
  if(!email.toLowerCase().endsWith("@gmail.com")){toast("Use a Gmail address (@gmail.com)");return;}
  user={name,email};localStorage.setItem("nahata_user",JSON.stringify(user));checkLogin();
}
function logout(){localStorage.removeItem("nahata_user");location.reload();}

function md(t){
  const bl=[];
  let s=esc(t).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{bl.push(`<pre><button class="cp" type="button">Copy</button><code>${c.replace(/\n$/,"")}</code></pre>`);return "\u0000"+(bl.length-1)+"\u0000";});
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/^#{1,4} (.+)$/gm,"<h4>$1</h4>").replace(/^[-*] (.+)$/gm,"• $1");
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>bl[i]);
}
function addMsg(t,who,extra=""){
  const em=$("empty");if(em)em.remove();
  const d=document.createElement("div");d.className="msg "+who;
  d.innerHTML=`<div class="txt">${md(t)}</div>${extra}`;
  $("chat").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight;return d;
}
function setTxt(d,t){d.querySelector(".txt").innerHTML=md(t);}
function speak(t){
  if(!window.speechSynthesis)return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g," code block ").replace(/[*#`]/g,""));u.lang=(typeof lang!=="undefined")?lang:"en-IN";speechSynthesis.speak(u);
}
function addActs(d,t){
  if(!t)return;const a=document.createElement("div");a.className="acts";
  const mk=(l,f)=>{const b=document.createElement("button");b.type="button";b.textContent=l;b.onclick=()=>f(b);a.appendChild(b);};
  mk("Copy",b=>{navigator.clipboard.writeText(t);b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1500);});
  mk("Listen",()=>{if(window.speechSynthesis&&speechSynthesis.speaking)speechSynthesis.cancel();else speak(t);});
  d.appendChild(a);
}
function saveHist(){chatLog=chatLog.slice(-40);localStorage.setItem("nahata_hist",JSON.stringify(chatLog));}
function restore(){chatLog.forEach(m=>{const d=addMsg(m.content,m.role==="user"?"user":"ai");if(m.role!=="user")addActs(d,m.content);});}
const ARROW='<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',STOP='<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';
function setBusy(b){busy=b;$("sendBtn").innerHTML=b?STOP:ARROW;$("sendBtn").setAttribute("aria-label",b?"Stop":"Send");}

/* attachments */
function handleFiles(files){
  for(const file of files){pendingFiles.push({id:Math.random().toString(36).slice(2),file,url:URL.createObjectURL(file)});}
  renderTags();
}
function renderTags(){
  const box=$("taggedFiles");box.innerHTML="";
  pendingFiles.forEach(o=>{
    const d=document.createElement("div");d.className="tagChip";
    const p=o.file.type.startsWith("image/")?`<img src="${o.url}" alt="">`:o.file.type.startsWith("video/")?`<video src="${o.url}"></video>`:`<div class="ext">${esc(o.file.name.split(".").pop().toUpperCase().slice(0,4))}</div>`;
    d.innerHTML=`${p}<div>${esc(o.file.name.slice(0,18))}<small>${(o.file.size/1048576).toFixed(2)} MB</small></div><button class="x" aria-label="Remove">✕</button>`;
    d.querySelector(".x").onclick=()=>{pendingFiles=pendingFiles.filter(p=>p.id!==o.id);renderTags();};
    box.appendChild(d);
  });
}

async function send(viaVoice=false){
  if(busy)return;
  const txt=$("msgInput").value.trim();
  if(!txt&&!pendingFiles.length)return;
  let extra="";
  pendingFiles.forEach(o=>{
    if(o.file.type.startsWith("image/"))extra+=`<img src="${o.url}" alt="">`;
    else if(o.file.type.startsWith("video/"))extra+=`<video src="${o.url}" controls></video>`;
    else extra+=`<div class="tagChip" style="margin-top:8px">${esc(o.file.name)}</div>`;
  });
  addMsg(txt||"Sent files","user",extra);
  const files=[...pendingFiles],hist=chatLog.slice(-12);
  $("msgInput").value="";grow();pendingFiles=[];renderTags();
  setBusy(true);
  let node=addMsg("","ai",'<div class="dots"><span></span><span></span><span></span></div>'),reply="";
  ctl=new AbortController();
  const done=()=>{chatLog.push({role:"user",content:txt||"(sent files)"},{role:"assistant",content:reply});saveHist();addActs(node,reply);};
  try{
    if(!files.length&&!/\b(logo|image|photo|poster|thumbnail|banner|question paper)\b/i.test(txt)){
      const r=await fetch("/chat-stream",{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,body:JSON.stringify({message:txt,history:hist,email:user?user.email:""})});
      const rd=r.body.getReader(),dec=new TextDecoder();
      for(;;){
        const {done:fin,value}=await rd.read();if(fin)break;
        reply+=dec.decode(value,{stream:true});
        const dt=node.querySelector(".dots");if(dt)dt.remove();
        setTxt(node,reply);$("chat").scrollTop=$("chat").scrollHeight;
      }
    }else{
      const fd=new FormData();fd.append("message",txt);fd.append("history",JSON.stringify(hist));if(user)fd.append("email",user.email);
      files.forEach(p=>fd.append("file",p.file));
      const r=await fetch("/chat",{method:"POST",body:fd,signal:ctl.signal});const data=await r.json();node.remove();
      let h="";
      if(data.edited&&data.original_image){
        h+=`<div class="ba"><figure><img src="${data.original_image}" alt="Before"><figcaption>Before</figcaption></figure><figure><img src="${data.image}" alt="After"><figcaption>After</figcaption></figure></div><a class="btn" href="${data.image}" download="nahata-edit.jpg">Download edited photo</a>`;
      }else{
        if(data.image)h+=`<img src="${data.image}" alt="Generated image"><a class="btn" href="${data.image}" target="_blank" rel="noopener">Open image</a>`;
        if(data.video)h+=`<video src="${data.video}" controls></video>`;
        if(data.file)h+=`<a class="btn" href="${data.file}" target="_blank" rel="noopener">Open file</a>`;
      }
      reply=data.reply||"";node=addMsg(reply,"ai",h);
      (data.files||[]).forEach(f=>{
        const b=document.createElement("button");b.className="btn";b.textContent="Download "+f[0];
        b.onclick=()=>downloadFile(f[0],f[1]);node.appendChild(b);node.appendChild(document.createTextNode(" "));
      });
    }
    done();if(viaVoice)speak(reply);
  }catch(e){
    if(e.name==="AbortError"){if(reply)done();else node.remove();}
    else{node.remove();addMsg("Couldn't reach the server. Check your connection and try again.","ai");}
  }
  setBusy(false);
}
async function downloadFile(name,content){
  const res=await fetch("/make-file",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({filename:name,content})});
  window.open((await res.json()).url);
}

/* voice */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,lang="en-IN";
function setState(live,t){$("mic").classList.toggle("live",live);$("micState").textContent=t;}
function startRec(){
  rec=new SR();rec.lang=lang;rec.interimResults=true;rec.continuous=true;
  rec.onstart=()=>setState(true,"Listening");
  rec.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;$("liveText").textContent=s;};
  rec.onerror=e=>setState(false,e.error==="not-allowed"?"Allow microphone access in your browser":"Didn't catch that. Tap the orb to retry");
  rec.onend=()=>{if($("micState").textContent==="Listening")setState(false,"Tap the orb to speak again");};
  try{rec.start();}catch(e){}
}
function stopRec(){if(rec){rec.onend=null;try{rec.stop();}catch(e){}rec=null;}}
function openMic(){
  if(!SR){toast("Voice input isn't supported in this browser. Try Chrome.");return;}
  if(window.speechSynthesis)speechSynthesis.cancel();$("liveText").textContent="";$("mic").classList.add("open");startRec();
}
function closeMic(apply,go){
  const t=$("liveText").textContent.trim();stopRec();setState(false,"");$("mic").classList.remove("open");
  if(apply&&t){const i=$("msgInput");i.value=(i.value?i.value+" ":"")+t;grow();i.focus();if(go)send(true);}
}
$("orb").onclick=()=>{if($("mic").classList.contains("live")){stopRec();setState(false,"Tap the orb to speak again");}else startRec();};
$("langBtn").onclick=()=>{lang=lang==="en-IN"?"hi-IN":"en-IN";$("langBtn").textContent=lang==="en-IN"?"English":"हिन्दी";stopRec();startRec();};
$("micCancel").onclick=()=>closeMic(false);
$("micDone").onclick=()=>closeMic(true);
$("micSend").onclick=()=>closeMic(true,true);
$("micBtn").onclick=openMic;

/* wiring */
function grow(){const i=$("msgInput");i.style.height="auto";i.style.height=Math.min(i.scrollHeight,140)+"px";}
$("msgInput").addEventListener("input",grow);
$("msgInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
$("sendBtn").onclick=()=>busy?(ctl&&ctl.abort()):send();
$("fileBtn").onclick=()=>$("fileInput").click();
$("fileInput").onchange=e=>{handleFiles(e.target.files);e.target.value="";};
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{$("msgInput").value=c.dataset.p;grow();$("msgInput").focus();if(/photo|person|me/i.test(c.dataset.p)&&!pendingFiles.length)toast("Attach a photo, then press send");});
$("chat").addEventListener("dragover",e=>e.preventDefault());
$("chat").addEventListener("drop",e=>{e.preventDefault();handleFiles(e.dataTransfer.files);});
$("newChat").onclick=()=>{localStorage.removeItem("nahata_hist");location.reload();};
$("chat").addEventListener("click",e=>{if(e.target.classList.contains("cp")){navigator.clipboard.writeText(e.target.nextSibling.textContent);e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy",1500);}});
checkLogin();restore();
</script>
</body>
</html>
