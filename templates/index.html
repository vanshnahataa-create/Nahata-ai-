<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nahata.AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family: sans-serif;background:#0f0f0f;color:white;height:100vh;display:flex;flex-direction:column}
.header{padding:15px;text-align:center;background:#1a1a1a;border-bottom:1px solid #333;font-weight:bold;font-size:20px}
#chatbox{flex:1;overflow-y:auto;padding:15px;padding-bottom:120px}
.msg{margin:10px 0;padding:12px 15px;border-radius:18px;max-width:85%;line-height:1.4}
.user{background:#2a7fff;margin-left:auto}
.ai{background:#222;margin-right:auto;border:1px solid #333}
.input-area{
  position:fixed;
  bottom:0;left:0;right:0;
  background:#1a1a1a;
  padding:12px 12px 25px 12px; /* LIFTED UP - 25px from bottom */
  display:flex;gap:10px;
  border-top:1px solid #333;
  padding-bottom: calc(25px + env(safe-area-inset-bottom)); /* Extra lift for iPhone/Android */
}
.input-area input{flex:1;padding:14px;border-radius:25px;border:none;outline:none;background:#2a2a2a;color:white;font-size:16px}
.input-area button{padding:14px 22px;border-radius:25px;border:none;background:#2a7fff;color:white;font-weight:bold}
@media(max-width:600px){
 .input-area{bottom:20px; margin:0 10px; border-radius:30px; border:1px solid #333; box-shadow:0 5px 20px rgba(0,0,0,0.5)}
}
</style>
</head>
<body>
<div class="header">Nahata.AI ✨</div>
<div id="chatbox"><div class="msg ai">Hello! I am Nahata.AI. How can I help you today?</div></div>
<div class="input-area">
<input id="inp" placeholder="Type a message... e.g. make a logo" onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">Send</button>
</div>
<script>
async function send(){
  let input=document.getElementById("inp");
  let msg=input.value.trim();
  if(!msg) return;
  let box=document.getElementById("chatbox");
  box.innerHTML+=`<div class="msg user">${msg}</div>`;
  input.value="";
  box.scrollTop=box.scrollHeight;
  let tempId="temp"+Date.now();
  box.innerHTML+=`<div class="msg ai" id="${tempId}">Thinking...</div>`;
  box.scrollTop=box.scrollHeight;
  try{
    let res=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg})});
    let data=await res.json();
    document.getElementById(tempId).innerText=data.reply;
  }catch(e){
    document.getElementById(tempId).innerText="Error connecting to server. Please check Render.";
  }
  box.scrollTop=box.scrollHeight;
}
</script>
</body>
</html>
