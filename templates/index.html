<!DOCTYPE html>
<html>
<head>
<title>Nahata.AI - World Best by Vansh</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',Arial}
body{background:linear-gradient(135deg,#f5f7ff 0%,#ffffff 100%);color:#111;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);color:white;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;z-index:100}
header h1{font-size:22px;font-weight:700;letter-spacing:-0.5px} header h1 b{color:#6c5bff}
header span{font-size:11px;color:#aaa;display:block;margin-top:2px}
#userBox{background:#1a1a1a;border:1px solid #333;padding:7px 14px;border-radius:30px;font-size:12px;display:flex;align-items:center;gap:8px}
#chat{flex:1;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:82%;padding:14px 18px;border-radius:22px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap;font-size:14.5px;animation:pop 0.3s ease}
@keyframes pop{from{transform:scale(0.96) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.user{background:linear-gradient(135deg,#000 0%,#222 100%);color:white;margin-left:auto;border-bottom-right-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,0.15)}
.ai{background:white;border:1px solid #e9e9ff;color:#111;border-bottom-left-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,0.06)}
.msg img,.msg video{max-width:100%;border-radius:14px;margin-top:10px;display:block;box-shadow:0 6px 18px rgba(0,0,0,0.1)}
.fileTag{background:#f0f0ff;border:1px solid #d9d6ff;padding:8px 12px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:#333}

/* INPUT BAR - REAL TAGGING LIKE WHATSAPP */
#inputWrapper{background:white;border-top:1px solid #eee;padding:12px 12px 14px;position:sticky;bottom:0}
#taggedFiles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;max-height:120px;overflow-y:auto}
.tagChip{background:linear-gradient(135deg,#eef0ff,#f7f0ff);border:1px solid #d8d4ff;border-radius:14px;padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:12.5px;position:relative;animation:pop 0.2s}
.tagChip img,.tagChip video{width:36px;height:36px;object-fit:cover;border-radius:8px}
.tagChip.remove{cursor:pointer;background:black;color:white;width:18px;height:18px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:11px}
#inputArea{display:flex;align-items:center;gap:8px;background:#f5f5f7;border:1px solid #e6e6e6;border-radius:28px;padding:6px 6px 6px 14px;transition:0.2s}
#inputArea:focus-within{border-color:#6c5bff;box-shadow:0 0 0 4px rgba(108,91,255,0.12)}
#msgInput{flex:1;border:none;outline:none;background:transparent;padding:10px 6px;font-size:15px}
.iconBtn{width:42px;height:42px;border:none;border-radius:50%;cursor:pointer;display:flex;justify-content:center;align-items:center;font-size:18px;transition:0.2s}
#fileBtn{background:white;border:1px solid #e0e0e0} #fileBtn:hover{background:#eee}
#voiceBtn{background:#f0f0f0} #voiceBtn:hover{background:#e5e5e5}
#sendBtn{background:linear-gradient(135deg,#6c5bff,#8b5bff);color:white;box-shadow:0 6px 16px rgba(108,91,255,0.35)} #sendBtn:hover{transform:scale(1.05)}

/* LOGIN */
#loginModal{position:fixed;inset:0;background:rgba(10,10,15,0.88);backdrop-filter:blur(16px);display:flex;justify-content:center;align-items:center;z-index:9999}
.loginCard{background:white;padding:34px 28px;border-radius:24px;width:92%;max-width:380px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,0.3)}
.loginCard h2{font-size:24px;font-weight:700;margin-bottom:6px}.loginCard p{color:#666;font-size:13px}
.loginCard input{width:100%;padding:13px 16px;border:1px solid #e5e5e5;border-radius:14px;margin:10px 0 0;outline:none;font-size:14px}
.loginCard input:focus{border-color:#6c5bff;box-shadow:0 0 0 3px rgba(108,91,255,0.12)}
.loginBtn{width:100%;padding:14px;background:black;color:white;border:none;border-radius:14px;margin-top:16px;font-weight:600;font-size:15px;cursor:pointer}
</style>
</head>
<body>

<div id="loginModal">
  <div class="loginCard">
    <div style="font-size:42px;margin-bottom:10px">✨</div>
    <h2>Nahata.AI</h2>
    <p>World Best Search Engine by <b>Vansh Rajesh Nahata</b><br>Login with Gmail to continue</p>
    <input id="nameInput" placeholder="Your Name - e.g. Vansh" />
    <input id="emailInput" type="email" placeholder="yourname@gmail.com" />
    <button class="loginBtn" onclick="saveUser()">Continue →</button>
    <p style="margin-top:12px;font-size:11px;color:#999">🔒 Saved securely in your browser - Auto login next time</p>
  </div>
</div>

<header>
  <div><h1>Nahata<b>.AI</b> <span>World Best • Made by Vansh Rajesh Nahata • Real Files • Video MP4</span></h1></div>
  <div id="userBox"></div>
</header>

<div id="chat"></div>

<div id="inputWrapper">
  <div id="taggedFiles"></div>
  <div id="inputArea">
    <input type="file" id="fileInput" hidden multiple accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.zip" onchange="handleFiles(this.files)">
    <button class="iconBtn" id="fileBtn" onclick="document.getElementById('fileInput').click()" title="Attach Photo / Video / File">📎</button>
    <input id="msgInput" placeholder="Ask anything... Attach photo video file will show here 👆" onkeypress="if(event.key==='Enter')send()" />
    <button class="iconBtn" id="voiceBtn" onclick="startVoice()">🎤</button>
    <button class="iconBtn" id="sendBtn" onclick="send()">↑</button>
  </div>
</div>

<script>
let user=JSON.parse(localStorage.getItem("nahata_user")||"null");
let pendingFiles=[];

function checkLogin(){
  if(user && user.email){
    document.getElementById("loginModal").style.display="none";
    document.getElementById("userBox").innerHTML=`<span>👤</span> <b>${user.name}</b> • ${user.email} <span onclick="logout()" style="margin-left:10px;color:#ff6b6b;cursor:pointer">Logout</span>`;
    addMsg(`Welcome back ${user.name}! 🚀 Your Gmail ${user.email} is remembered in browser. I'm Nahata.AI - Send photo, video MP4, files - They will tag in message bar like Instagram!`, "ai");
  }else document.getElementById("loginModal").style.display="flex";
}
function saveUser(){
  let name=document.getElementById("nameInput").value.trim();
  let email=document.getElementById("emailInput").value.trim();
  if(!name||!email){alert("Enter Name & Gmail");return;}
  if(!email.toLowerCase().includes("@gmail.com")){alert("Please enter valid Gmail ( @gmail.com )");return;}
  user={name,email,time:new Date().toLocaleString()};
  localStorage.setItem("nahata_user",JSON.stringify(user));
  checkLogin(); document.getElementById("loginModal").style.display="none";
}
function logout(){localStorage.removeItem("nahata_user");location.reload();}

function addMsg(t,who,extraHTML=""){
  let d=document.createElement("div"); d.className="msg "+who;
  d.innerHTML=`<div>${escapeHtml(t)}</div>${extraHTML}`;
  document.getElementById("chat").appendChild(d);
  document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight;
}
function escapeHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function handleFiles(files){
  for(let file of files){
    let id=Math.random().toString(36).slice(2);
    let obj={id,file,url:URL.createObjectURL(file)};
    pendingFiles.push(obj);
    renderTags();
  }
}
function renderTags(){
  let box=document.getElementById("taggedFiles"); box.innerHTML="";
  pendingFiles.forEach(o=>{
    let div=document.createElement("div"); div.className="tagChip";
    let preview="";
    if(o.file.type.startsWith("image/")) preview=`<img src="${o.url}">`;
    else if(o.file.type.startsWith("video/")) preview=`<video src="${o.url}"></video>`;
    else preview=`<div style="width:36px;height:36px;background:black;color:white;display:flex;justify-content:center;align-items:center;border-radius:8px;font-size:12px">${o.file.name.split(".").pop().toUpperCase()}</div>`;
    div.innerHTML=`${preview}<div><b>${o.file.name.slice(0,18)}</b><br><span style="color:#666">${(o.file.size/1024/1024).toFixed(2)} MB • Tagged</span></div><div class="remove" onclick="removeTag('${o.id}')">✕</div>`;
    box.appendChild(div);
  });
}
function removeTag(id){pendingFiles=pendingFiles.filter(p=>p.id!==id);renderTags();}

async function send(){
  let txt=document.getElementById("msgInput").value.trim();
  if(!txt && pendingFiles.length===0) return;

  let extra="";
  pendingFiles.forEach(o=>{
    if(o.file.type.startsWith("image/")) extra+=`<img src="${o.url}"><div class="fileTag">🖼️ ${o.file.name} - Tagged in bar</div>`;
    else if(o.file.type.startsWith("video/")) extra+=`<video src="${o.url}" controls></video><div class="fileTag">🎬 ${o.file.name} - MP4 Video Tagged</div>`;
    else extra+=`<div class="fileTag">📁 ${o.file.name} - File Tagged in bar</div>`;
  });

  addMsg(txt||"Sent files", "user", extra);
  document.getElementById("msgInput").value="";

  let fd=new FormData();
  fd.append("message", txt);
  if(user) fd.append("email", user.email);
  pendingFiles.forEach(p=>fd.append("file", p.file));

  let displayFiles=[...pendingFiles];
  pendingFiles=[]; renderTags();

  let r=await fetch("/chat",{method:"POST",body:fd});
  let data=await r.json();

  let html="";
  if(data.image) html+=`<img src="${data.image}">`;
  if(data.video) html+=`<video src="${data.video}" controls></video><div class="fileTag">🎬 Real MP4: ${data.video.split("/").pop()}</div>`;
  if(data.audio) html+=`<audio controls src="${data.audio}" style="width:100%;margin-top:8px"></audio>`;
  if(data.file) html+=`<div class="fileTag">📁 <a href="${data.file}" target="_blank">Download ${data.file.split("/").pop()}</a> - Real file</div>`;

  addMsg(data.reply, "ai", html);

  if(data.files){
    data.files.forEach(f=>{
      let a=document.createElement("div"); a.className="msg ai";
      a.innerHTML=`📄 <b>${f[0]}</b> Generated <br><button onclick="downloadFile('${f[0]}','${btoa(unescape(encodeURIComponent(f[1])))}')" style="margin-top:8px;padding:8px 14px;border-radius:10px;border:none;background:black;color:white;cursor:pointer">⬇️ Download ${f[0]}</button>`;
      document.getElementById("chat").appendChild(a);
    });
  }
}

async function downloadFile(name,b64){
  let content=decodeURIComponent(escape(atob(b64)));
  let res=await fetch("/make-file",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({filename:name,content})});
  let j=await res.json(); window.open(j.url);
}

function startVoice(){
  let rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.lang="en-IN"; rec.start();
  rec.onresult=e=>{document.getElementById("msgInput").value=e.results[0][0].transcript;};
}

// Drag & Drop real tagging
document.getElementById("chat").addEventListener("dragover",e=>{e.preventDefault(); e.target.style.background="#eef0ff"});
document.getElementById("chat").addEventListener("dragleave",e=>{e.target.style.background=""});
document.getElementById("chat").addEventListener("drop",e=>{
  e.preventDefault(); handleFiles(e.dataTransfer.files);
  document.getElementById("chat").style.background="";
});

checkLogin();
</script>
</body>
</html>
