<!DOCTYPE html>
<html>
<head>
<title>Nahata.AI - World Best by Vansh</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:white;color:black;height:100vh;display:flex;flex-direction:column}
header{background:black;color:white;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px} header span{font-size:12px;color:#ccc}
#userBox{font-size:13px;background:#222;padding:6px 10px;border-radius:20px}
#chat{flex:1;overflow-y:auto;padding:20px;background:#f9f9f9}
.msg{max-width:80%;padding:12px 16px;border-radius:18px;margin:8px 0;word-wrap:break-word;white-space:pre-wrap}
.user{background:black;color:white;margin-left:auto;border-bottom-right-radius:4px}
.ai{background:white;border:1px solid #ddd;color:black;border-bottom-left-radius:4px}
#inputArea{display:flex;padding:12px;border-top:1px solid #ddd;gap:8px;background:white;align-items:center}
input{flex:1;padding:12px 16px;border:1px solid #ccc;border-radius:25px;outline:none}
button{padding:12px 18px;border:none;border-radius:25px;background:black;color:white;cursor:pointer}
#fileBtn{background:#eee;color:black}
#loginModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:9999}
.loginCard{background:white;padding:30px;border-radius:16px;width:90%;max-width:360px;text-align:center}
.loginCard input{width:100%;margin:10px 0;border:1px solid #ccc}
.loginCard h2{margin-bottom:10px}
</style>
</head>
<body>

<!-- LOGIN POPUP - Gmail Remember -->
<div id="loginModal">
  <div class="loginCard">
    <h2>Welcome to Nahata.AI</h2>
    <p style="font-size:13px;color:#666;margin-bottom:15px">Made by Vansh Rajesh Nahata<br>Enter your Gmail to continue</p>
    <input id="nameInput" placeholder="Your Name" />
    <input id="emailInput" placeholder="Your Gmail (example@gmail.com)" type="email" />
    <button onclick="saveUser()" style="width:100%;margin-top:10px">Continue →</button>
    <p style="font-size:11px;color:#888;margin-top:10px">Saved in browser - Auto login next time</p>
  </div>
</div>

<header>
  <div><h1>Nahata.AI</h1><span>World Best Search Engine - Vansh</span></div>
  <div id="userBox"></div>
</header>

<div id="chat"></div>

<div id="inputArea">
  <input type="file" id="fileInput" style="display:none" onchange="uploadFile()">
  <button id="fileBtn" onclick="document.getElementById('fileInput').click()">📁</button>
  <input id="msgInput" placeholder="Ask anything... video, photo, file, paper..." onkeypress="if(event.key==='Enter')send()" />
  <button onclick="startVoice()" id="voiceBtn">🎤</button>
  <button onclick="send()">Send</button>
</div>

<script>
let user = JSON.parse(localStorage.getItem("nahata_user") || "null");

function checkLogin(){
  if(user && user.email){
    document.getElementById("loginModal").style.display="none";
    document.getElementById("userBox").innerHTML = `👤 ${user.name} | ${user.email} <span onclick="logout()" style="cursor:pointer;color:red;margin-left:8px">Logout</span>`;
    addMsg(`Welcome back ${user.name}! (${user.email}) - I remembered you from browser! How can I help?`, "ai");
  } else {
    document.getElementById("loginModal").style.display="flex";
  }
}

function saveUser(){
  let name=document.getElementById("nameInput").value.trim();
  let email=document.getElementById("emailInput").value.trim();
  if(!name ||!email){alert("Enter Name and Gmail");return;}
  if(!email.includes("@gmail.com")){alert("Please enter Gmail ID (must contain @gmail.com)");return;}
  user={name,email,time:new Date().toLocaleString()};
  localStorage.setItem("nahata_user", JSON.stringify(user));
  document.getElementById("loginModal").style.display="none";
  document.getElementById("userBox").innerHTML = `👤 ${name} | ${email} <span onclick="logout()" style="cursor:pointer;color:red;margin-left:8px">Logout</span>`;
  addMsg(`Hi ${name}! Your Gmail ${email} saved in browser! Next time auto login. I am Nahata.AI made by Vansh.`, "ai");
}

function logout(){
  localStorage.removeItem("nahata_user");
  location.reload();
}

function addMsg(t,who){
  let d=document.createElement("div"); d.className="msg "+who; d.innerText=t;
  document.getElementById("chat").appendChild(d);
  document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight;
}

async function send(){
  let inp=document.getElementById("msgInput");
  let txt=inp.value.trim(); if(!txt)return;
  addMsg(txt,"user"); inp.value="";
  let r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:txt,email:user?user.email:"",name:user?user.name:""})});
  let data=await r.json();
  addMsg(data.reply,"ai");
  if(data.image){ let img=document.createElement("img"); img.src=data.image; img.style.maxWidth="90%"; img.style.borderRadius="12px"; img.style.margin="10px 0"; document.getElementById("chat").appendChild(img); }
  if(data.files){ data.files.forEach(f=>{ let a=document.createElement("a"); a.href="#"; a.innerText="📄 Download "+f[0]; a.onclick=async()=>{ let res=await fetch("/make-file",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({filename:f[0],content:f[1]})}); let j=await res.json(); window.open(j.url); }; document.getElementById("chat").appendChild(a); }); }
}

async function uploadFile(){
  let file=document.getElementById("fileInput").files[0]; if(!file)return;
  let fd=new FormData(); fd.append("file",file); fd.append("message",document.getElementById("msgInput").value||"File upload");
  addMsg("Uploading "+file.name+"...","user");
  let r=await fetch("/chat",{method:"POST",body:fd}); let data=await r.json(); addMsg(data.reply,"ai");
}

function startVoice(){
  let rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.lang="en-IN"; rec.start(); rec.onresult=(e)=>{document.getElementById("msgInput").value=e.results[0][0].transcript; send();}
}

checkLogin();
</script>
</body>
</html>
