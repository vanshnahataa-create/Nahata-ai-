<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Car Game - Nahata.AI</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>*{margin:0;padding:0;overflow:hidden;font-family:system-ui}body{background:#000}#ui{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,0.7);padding:12px;border-radius:12px;z-index:10}#ui h2{font-size:16px}button{padding:8px 14px;border:none;border-radius:20px;background:#fff;color:#000;font-weight:800;cursor:pointer;margin-top:8px}</style>
</head><body>
<div id="ui">
<h2>🏎️ Nahata 3D Car Game</h2>
<p>By Vansh Rajesh Nahata</p>
<p>WASD to Drive | SPACE Brake</p>
<p>Speed: <span id="speed">0</span> km/h</p>
<button onclick="location.href='/'">Back to Nahata.AI</button>
</div>
<script type="module">
import * as THREE from 'three';
let scene=new THREE.Scene(); scene.background=new THREE.Color(0x87CEEB);
let camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
let renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);

// Light
scene.add(new THREE.AmbientLight(0xffffff,0.7));
let dl=new THREE.DirectionalLight(0xffffff,1); dl.position.set(10,20,10); dl.castShadow=true; scene.add(dl);

// Ground
let ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500), new THREE.MeshStandardMaterial({color:0x1a5d1a})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
let road=new THREE.Mesh(new THREE.PlaneGeometry(20,500), new THREE.MeshStandardMaterial({color:0x333333})); road.rotation.x=-Math.PI/2; road.position.y=0.01; scene.add(road);

// Car - Simple 3D
let carGroup=new THREE.Group();
let body=new THREE.Mesh(new THREE.BoxGeometry(2,0.8,4), new THREE.MeshStandardMaterial({color:0xff0000})); body.position.y=0.8; body.castShadow=true; carGroup.add(body);
let top=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.7,2), new THREE.MeshStandardMaterial({color:0x000000})); top.position.y=1.5; top.position.z=-0.3; carGroup.add(top);
let wheelGeo=new THREE.CylinderGeometry(0.4,0.4,0.3,16);
let wheelMat=new THREE.MeshStandardMaterial({color:0x111111});
[[1,0,1.2],[-1,0,1.2],[1,0,-1.2],[-1,0,-1.2]].forEach(p=>{let w=new THREE.Mesh(wheelGeo,wheelMat); w.rotation.z=Math.PI/2; w.position.set(p[0],p[1]+0.4,p[2]); carGroup.add(w);});
scene.add(carGroup);

let keys={}; let speed=0, angle=0;
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
camera.position.set(0,5,10);

function animate(){
 requestAnimationFrame(animate);
 if(keys['w']||keys['arrowup']) speed=Math.min(speed+0.02,0.4);
 if(keys['s']||keys['arrowdown']) speed=Math.max(speed-0.02,-0.15);
 else speed*=0.98;
 if(keys[' '] ) speed*=0.9;
 if(keys['a']||keys['arrowleft']) angle+=0.03*speed;
 if(keys['d']||keys['arrowright']) angle-=0.03*speed;
 carGroup.rotation.y=angle;
 carGroup.position.x+=Math.sin(angle)*speed;
 carGroup.position.z+=Math.cos(angle)*speed;
 camera.position.lerp(new THREE.Vector3(carGroup.position.x-8*Math.sin(angle),5,carGroup.position.z-8*Math.cos(angle)),0.1);
 camera.lookAt(carGroup.position);
 document.getElementById('speed').innerText=Math.floor(Math.abs(speed)*200);
 renderer.render(scene,camera);
}
animate();
</script>
</body></html>
