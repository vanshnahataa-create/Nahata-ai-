<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nahata.AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#050209;color:white;min-height:100vh;overflow:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% -10%, #8b5cf6 0%, transparent 40%),radial-gradient(circle at 90% 90%, #ec4899 0%, transparent 30%),radial-gradient(circle at 10% 90%, #7c3aed 0%, transparent 40%);opacity:.6;filter:blur(50px)}
.phone{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;position:relative}
.top-glass{margin:12px;border:1px solid rgba(168,85,247,.4);background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));backdrop-filter:blur(25px);border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;background:linear-gradient(135deg,#8a5cff,#ff5cf4);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 0 20px #8a5cff88}
.title{font-size:26px;font-weight:800}
.sub{font-size:13px;color:#c084fc}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
.glass-card{background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));backdrop-filter:blur(25px);border:1px solid rgba(168,85,247,.35);border-radius:20px;box-shadow:0 0 20px #a855f722}
.welcome{padding:16px 20px;text-align:center}
.welcome h2{color:#e9a5ff;font-size:22px}
.user-bubble{align-self:flex-end;max-width:85%;padding:14px 18px;border-radius:20px 20px 6px 20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15)}
.ai-bubble{padding:16px}
.ai-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ai-icon{width:32px;height:32px;background:#1a1033;border:1px solid #a855f7;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ai-text{font-size:14px;line-height:1.6;color:#e5e7eb}
.typing-bar{margin-top:10px;background:rgba(0,0,0,.3);border:1px solid rgba(168,85,247,.3);border-radius:30px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:#c084fc}
.suggest-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s-chip{padding:14px;border-radius:18px;cursor:pointer;min-height:80px}
#bottom{margin:12px;background:rgba(255,255,255,.08);backdrop-filter:blur(30px);border:1px solid rgba(168,85,247,.5);border-radius:30px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px}
#inp{flex:1;background:transparent;border:none;color:white;outline:none;font-size:15px}
#send{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,#a855f7,#8b5cf6);color:white;font-size:18px}
</style>
</head>
<body>
<div class="phone">
<div class="top-glass">
<div class="logo">N</div>
<div><div class="title">Nahata.AI</div><div class="sub">ChatGPT-5 • Online</div></div>
</div>
<div id="chat">
<div class="glass-card welcome"><h2>Welcome back!</h2><p style="color:#aaa;font-size:14px">How can I help you today?</p></div>
<div class="suggest-grid" id="chips">
<div class="glass-card s-chip" onclick="fill('Write a Python script')">💻 Write a Python script</div>
<div class="glass-card s-chip" onclick="fill('Explain AI in Hindi')">🇮🇳 Explain in Hindi</div>
<div class="glass-card s-chip" onclick="fill('Business ideas for Nashik')">💡 Business Ideas</div>
<div class="glass-card s-chip" onclick="fill('Make a logo for Nahata.AI')">🎨 Make a Logo</div>
</div>
<div class="glass-card ai-bubble"><div class="ai-head"><div class="ai-icon">✦</div><div><b style="color:#c084fc">Nahata.AI</b></div></div><div class="ai-text">Hey! I'm Nahata.AI from Chandvad. What should we create today?</div></div>
</div>
<div id="bottom">
<input id="inp" placeholder="Ask Nahata.AI..." />
<button id="send" onclick="ask()">↑</button>
</div>
</div>

<script>
const chatEl = document.getElementById('chat');
const inp = document.getElementById('inp');

function fill(t){ inp.value=t; ask(); }

async function ask(){
  let q = inp.value.trim(); if(!q) return;
  document.getElementById('chips').style.display='none';
  chatEl.innerHTML += `<div class="glass-card user-bubble">${q}</div>`;
  inp.value='';
  chatEl.scrollTop = chatEl.scrollHeight;

  let typing = document.createElement('div');
  typing.className='glass-card ai-bubble';
  typing.innerHTML=`<div class="typing-bar">●●● Nahata.AI is typing...</div>`;
  chatEl.appendChild(typing);

  try{
    // THIS IS THE FIXED LINE - CALLS YOUR PYTHON SERVER
    let r = await fetch("/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message: q})
    });
    let d = await r.json();
    typing.remove();
    chatEl.innerHTML += `<div class="glass-card ai-bubble"><div class="ai-head"><div class="ai-icon">✦</div><div><b style="color:#c084fc">Nahata.AI</b></div></div><div class="ai-text">${d.reply.replace(/\n/g,'<br>')}</div></div>`;
  }catch(e){
    typing.remove();
    chatEl.innerHTML += `<div class="glass-card ai-bubble"><div class="ai-text">⚠️ Error: ${e.message}</div></div>`;
  }
  chatEl.scrollTop = chatEl.scrollHeight;
}
inp.addEventListener("keydown",e=>{if(e.key==="Enter")ask()});
</script>
</body>
</html>
