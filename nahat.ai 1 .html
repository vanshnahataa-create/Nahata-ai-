<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nahata.AI - Your Smart AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#08080a;color:white;height:100vh;display:flex;flex-direction:column}
header{padding:16px 20px;display:flex;align-items:center;gap:12px;background:#0f0f10;border-bottom:1px solid #222}
.logo{width:36px;height:36px;background:linear-gradient(135deg,#8a5cff,#4a36ff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{padding:14px 18px;border-radius:18px;max-width:85%;line-height:1.5;font-size:15px}
.user{background:#1e1e20;align-self:flex-end}
.ai{background:#16161a;border:1px solid #2a2a3a;align-self:flex-start}
.ai b{color:#a78bfa}
#bottom{padding:14px;background:#0f0f10;border-top:1px solid #222;display:flex;gap:10px}
#inp{flex:1;padding:14px 18px;border-radius:30px;border:1px solid #333;background:#1a1a1d;color:white;outline:none}
button{padding:14px 22px;border-radius:30px;border:none;background:linear-gradient(135deg,#8a5cff,#4a36ff);color:white;font-weight:700}
.status{font-size:12px;color:#8a5cff;background:#1a162e;padding:4px 10px;border-radius:20px;margin-left:auto}
</style>
</head>
<body>
<header>
<div class="logo">N</div>
<div><div style="font-weight:800">Nahata.AI</div><div style="font-size:11px;color:#888">Nahata-3.5 • Pro • Online</div></div>
<div class="status">● Online</div>
</header>

<div id="chat">
<div class="msg ai"><b>Nahata.AI</b><br>Namaste! I am Nahata.AI, made in Chandvad. How can I help you today?</div>
</div>

<div id="bottom">
<input id="inp" placeholder="Message Nahata.AI..." />
<button onclick="ask()">Send</button>
</div>

<script>
const KEY = "gsk_YOUR_KEY_HERE_PASTE_IT";
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');

async function ask(){
 const q = inp.value.trim();
 if(!q) return;
 if(KEY.includes("YOUR_KEY")){alert("First paste your Groq API key in the code!");return;}
 chat.innerHTML+=`<div class='msg user'>${q}</div>`;
 inp.value='';
 chat.scrollTop=99999;
 
 try{
  const r = await fetch("https://api.groq.com/openai/v1/chat/completions",{
   method:"POST",
   headers:{"Content-Type":"application/json","Authorization":"Bearer "+KEY},
   body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"system",content:"You are Nahata.AI, a helpful AI created by Nahata family. You are proud to be from Chandvad, Maharashtra. Be friendly, smart and helpful."},{role:"user",content:q}]})
  });
  const d = await r.json();
  const ans = d.choices[0].message.content;
  chat.innerHTML+=`<div class='msg ai'><b>Nahata.AI</b><br>${ans.replace(/\n/g,'<br>')}</div>`;
 }catch(e){chat.innerHTML+=`<div class='msg ai'>Error: Check API Key - ${e.message}</div>`;}
 chat.scrollTop=chat.scrollHeight;
}
inp.addEventListener("keydown",e=>{if(e.key==="Enter")ask()});
</script>
</body>
</html>
